name: 内核构建 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
        default: ReSukiSU
      target_sub_level:
        description: "选择构建目标 (选择 all 构建全部，选择数字仅构建单作业)"
        required: true
        type: choice
        options:
          - "all"
          - "194"
          - "189"
          - "185"
          - "180"
          - "178"
          - "170"
          - "167"
          - "153"
          - "151"
          - "149"
          - "148"
          - "144"
          - "137"
          - "123"
          - "119"
          - "104"
          - "94"
          - "78"
          - "74"
          - "X"
        default: "194" # 默认只跑 194
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      target_sub_level:
        required: false
        type: string
        default: "all"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false

jobs:
  # 第一步：计算要运行的 matrix 项
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          TARGET="${{ inputs.target_sub_level || 'all' }}"
          ALL_ITEMS='[
            {"sub_level": "74", "os_patch_level": "2023-01"},
            {"sub_level": "78", "os_patch_level": "2023-03"},
            {"sub_level": "94", "os_patch_level": "2023-05"},
            {"sub_level": "104", "os_patch_level": "2023-07"},
            {"sub_level": "119", "os_patch_level": "2023-09"},
            {"sub_level": "123", "os_patch_level": "2023-11"},
            {"sub_level": "137", "os_patch_level": "2024-01"},
            {"sub_level": "144", "os_patch_level": "2024-03"},
            {"sub_level": "148", "os_patch_level": "2024-05"},
            {"sub_level": "149", "os_patch_level": "2024-07"},
            {"sub_level": "151", "os_patch_level": "2024-08"},
            {"sub_level": "153", "os_patch_level": "2024-09"},
            {"sub_level": "167", "os_patch_level": "2024-11"},
            {"sub_level": "170", "os_patch_level": "2025-01"},
            {"sub_level": "178", "os_patch_level": "2025-03"},
            {"sub_level": "180", "os_patch_level": "2025-05"},
            {"sub_level": "185", "os_patch_level": "2025-07"},
            {"sub_level": "189", "os_patch_level": "2025-09"},
            {"sub_level": "194", "os_patch_level": "2025-12"},
            {"sub_level": "X", "os_patch_level": "lts"}
          ]'

          if [ "$TARGET" = "all" ]; then
            JSON_OUT="$ALL_ITEMS"
          else
            JSON_OUT=$(echo "$ALL_ITEMS" | jq -c "[.[] | select(.sub_level == \"$TARGET\")]")
          fi

          echo "matrix={\"include\":$JSON_OUT}" >> $GITHUB_OUTPUT

  build-kernels-a13-5-15:
    needs: set-matrix
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
